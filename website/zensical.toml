[project]
site_name = "Agent kit"
site_url = "https://shubin-vadim.github.io/AgentKit/"
site_description = "Portable agent skills, rules, MCP servers, and templates, installed by your agent for Cursor, Claude Code, OpenCode, or Codex."
site_author = "Vadim Shubin"
copyright = "Copyright &copy; 2026 Vadim Shubin · MIT License"
repo_url = "https://github.com/Shubin-vadim/AgentKit"
repo_name = "Shubin-vadim/AgentKit"
edit_uri = "edit/main/website/docs/"
docs_dir = "docs"
site_dir = "build"

nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "How it works" = "how-it-works.md" },
  { "Profiles" = "profiles.md" },
  { "Skills" = "skills.md" },
  { "Contributing" = "contributing.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/package-open"
repo = "fontawesome/brands/github"

# Two-state toggle: the first visit follows the system theme, then one click
# switches between light and dark. The icon shows the theme a click switches to.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Shubin-vadim/AgentKit"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
